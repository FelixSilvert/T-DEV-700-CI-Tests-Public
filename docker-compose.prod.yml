name: trinity

services:
  db:
    image: postgres:16
    container_name: "${DB_HOST:-trinity-db}"
    restart: always
    # ❌ PORTS NON EXPOSÉS en prod (sécurité - accessible uniquement via le réseau interne)
    # ports:
    #   - "${DB_EXTERNAL_PORT:-5433}:${DB_INTERNAL_PORT:-5432}"
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        tag: "{{.Name}}"
    networks:
      - trinity-network

  proxy:
    build:
      context: ./nginx
      dockerfile: Dockerfile.prod
    container_name: "${NGINX_HOST:-trinity-proxy}"
    restart: always
    ports:
      - "80:80"      # HTTP
      - "443:443"    # HTTPS (si SSL configuré)
    environment:
      - NGINX_INTERNAL_PORT=80
      - SERVER_NAME=${SERVER_NAME}
      - DOCKER_NETWORK_SUBNET=${DOCKER_NETWORK_SUBNET:-172.28.0.0/16}
      - BACKEND_HOST=${BACKEND_HOST:-trinity-back}
      - BACKEND_INTERNAL_PORT=${BACKEND_INTERNAL_PORT:-3001}
      - FRONTEND_HOST=${FRONTEND_HOST:-trinity-front}
      - FRONTEND_INTERNAL_PORT=${FRONTEND_INTERNAL_PORT:-3000}
      - NODE_ENV=production
    volumes:
      # Certificats SSL (à configurer si nécessaire)
      # - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      back:
        condition: service_healthy
      front:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        tag: "{{.Name}}"
    networks:
      - trinity-network

  back:
    build:
      context: ./server
      dockerfile: Dockerfile.prod
      args:
        NODE_ENV: production
    container_name: "${BACKEND_HOST:-trinity-back}"
    restart: always
    # ❌ PORTS NON EXPOSÉS (accessible seulement via proxy)
    # ports:
    #   - "${BACKEND_EXTERNAL_PORT:-3001}:${BACKEND_INTERNAL_PORT:-3001}"
    environment:
      NODE_ENV: production
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_INTERNAL_PORT}
      DB_DATABASE: ${DB_DATABASE}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      PORT: ${BACKEND_INTERNAL_PORT:-3001}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_FIRST_NAME: ${ADMIN_FIRST_NAME}
      ADMIN_LAST_NAME: ${ADMIN_LAST_NAME}
      ADMIN_PHONE_NUMBER: ${ADMIN_PHONE_NUMBER}
    # ❌ PAS DE VOLUMES en prod (code déjà dans l'image Docker)
    # volumes:
    #   - ./server:/usr/src/app
    #   - /usr/src/app/node_modules
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${BACKEND_INTERNAL_PORT:-3001}/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        tag: "{{.Name}}"
    networks:
      - trinity-network

  front:
    build:
      context: ./client
      dockerfile: Dockerfile.prod
      args:
        NODE_ENV: production
        NEXT_PUBLIC_API_URL: http://${SERVER_NAME}/api
    container_name: "${FRONTEND_HOST:-trinity-front}"
    restart: always
    # ❌ PORTS NON EXPOSÉS (accessible seulement via proxy)
    # ports:
    #   - "${FRONTEND_EXTERNAL_PORT:-3000}:${FRONTEND_INTERNAL_PORT:-3000}"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://${SERVER_NAME}/api
      BACKEND_URL: http://${BACKEND_HOST}:${BACKEND_INTERNAL_PORT}
    # ❌ PAS DE VOLUMES en prod (code déjà dans l'image Docker)
    # volumes:
    #   - ./client:/usr/src/app
    #   - /usr/src/app/node_modules
    depends_on:
      back:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${FRONTEND_INTERNAL_PORT:-3000}/login"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        tag: "{{.Name}}"
    networks:
      - trinity-network

volumes:
  postgres_data:
    name: trinity_postgres_data_prod
    driver: local

networks:
  trinity-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: "${DOCKER_NETWORK_SUBNET:-172.28.0.0/16}"
          gateway: "${DOCKER_NETWORK_GATEWAY:-172.28.0.1}"
