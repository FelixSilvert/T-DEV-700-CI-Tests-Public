name: trinity

services:
  db:
    image: postgres:16
    container_name: "${DB_HOST:-trinity-db}"
    restart: unless-stopped
    ports:
      - "${DB_EXTERNAL_PORT:-5433}:${DB_INTERNAL_PORT:-5432}"
    env_file:
      - ./server/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        tag: "{{.Name}}"
    networks:
      - trinity-network

  proxy:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: "${NGINX_HOST:-trinity-proxy}"
    restart: unless-stopped
    ports:
      - "${NGINX_EXTERNAL_PORT:-80}:${NGINX_INTERNAL_PORT:-80}"
    env_file:
      - .env
    environment:
      # Default values (fallback if .env missing or incomplete)
      - NGINX_INTERNAL_PORT=${NGINX_INTERNAL_PORT:-80}
      - SERVER_NAME=${SERVER_NAME:-localhost}
      - DOCKER_NETWORK_SUBNET=${DOCKER_NETWORK_SUBNET:-172.28.0.0/16}
      - BACKEND_HOST=${BACKEND_HOST:-trinity-back}
      - BACKEND_INTERNAL_PORT=${BACKEND_INTERNAL_PORT:-3000}
      - NODE_ENV=${NODE_ENV:-development}
    depends_on:
      - back
      # back:
      #   condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        tag: "{{.Name}}"
    networks:
      - trinity-network

  back:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: "${BACKEND_HOST:-trinity-back}"
    restart: unless-stopped
    ports:
      - "${BACKEND_EXTERNAL_PORT:-3000}:${BACKEND_INTERNAL_PORT:-3000}"
    env_file:
      - .env
      - ./server/.env
    depends_on:
      db:
        condition: service_healthy
    # healthcheck:
    #   test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        tag: "{{.Name}}"
    networks:
      - trinity-network

volumes:
  postgres_data:

networks:
  trinity-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: "${DOCKER_NETWORK_SUBNET:-172.28.0.0/16}"
          gateway: "${DOCKER_NETWORK_GATEWAY:-172.28.0.1}"
